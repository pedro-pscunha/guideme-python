version: 2

# The actions in .github/workflows are pinned to commit shas. Dependabot is
# what moves them, and what moves the pinned tools in pyproject.toml.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /examples/otlp
    schedule:
      interval: weekly
