name: Release

# A tag is the only trigger that publishes. Pushing v1.2.3 publishes 1.2.3 to
# PyPI, so the tag goes on a commit whose gate is already green, and the tag
# ruleset refuses to let it move afterwards.
#
# workflow_dispatch is a dry run, and it exists because the tag is immutable: a
# workflow that has never executed gets its first try on the one event nobody
# can take back. A dispatched run does `build`, which is the gate and `uv build`,
# and stops there. It CANNOT publish: `publish` is gated on
# `github.event_name == 'push'`, which is a fact about how the run started, not
# an input, a branch or a variable anyone can set, and a re-run keeps the event
# it was created with.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Build in a job with no id-token and no environment, so the artifact is made
  # where nothing can publish it. The gate runs again here because CI green on
  # main proves the branch, not the tag.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # The tag names the version that reaches PyPI, and a published version is
      # permanent, so a tag that disagrees with pyproject.toml stops here rather
      # than publishing a number nobody meant. Checked before the gate, which is
      # the slow part. On a dispatched run GITHUB_REF_NAME is a branch and there
      # is nothing to publish, so there is nothing for it to check.
      - name: the tag matches the project version
        if: github.event_name == 'push'
        run: |
          version="v$(uv version --short --no-sync)"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the project version ${version}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches the project version"

      - name: mise run sync
        run: mise run sync

      - name: mise run check
        run: mise run check

      # The gate's build task already produced these and ran twine check over
      # them. Building again from an explicit step keeps what is uploaded from
      # depending on what the gate happens to leave behind.
      - name: uv build
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted publishing: PyPI trades this job's OIDC token for a short-lived
  # upload token, so the repository holds no PyPI credential of any kind. PyPI
  # checks the owner, the repository, this workflow's file name and the
  # environment, so all four are part of the contract; AGENTS.md has the values.
  #
  # A tag push is the only event that reaches this job. A dispatched run finishes
  # at `build` with the archives uploaded as a workflow artifact and nothing sent
  # anywhere, which is the whole point of being able to dispatch it.
  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
