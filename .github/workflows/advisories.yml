name: Advisories

# A dependency does not have to change for it to become vulnerable. CI audits
# the lock file on every pull request; this re-audits the unchanged lock file
# against a moving advisory database.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: mise run sync
        run: mise run sync

      - name: mise run audit
        run: mise run audit
